# Keeps the Render free-tier backend from sleeping.
#
# Render suspends a free web service after ~15 minutes of inactivity, and the
# next request then waits on a cold start of roughly a minute. For a demo link
# that someone else is going to click without warning, that reads as "broken".
# This pings the health endpoint often enough to keep the service resident.
#
# Set the API_URL repository variable to the Render service URL to enable it
# (Settings -> Secrets and variables -> Actions -> Variables).
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health endpoint
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "API_URL variable not set - nothing to ping."
            exit 0
          fi
          curl --silent --show-error --fail --max-time 90 \
            "${{ vars.API_URL }}/api/health" || {
              echo "Health check failed."
              exit 1
            }
